[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph-local"
version = "0.1.0"
description = "Local-first repository knowledge graph, impact dashboard, and MCP context server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RepoGraph contributors"}]
dependencies = []

[project.scripts]
repograph = "repograph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repograph*"]
